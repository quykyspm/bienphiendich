<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>biên phiên dịch by QuyKy</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- Nạp thư viện Firebase Web SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <style>
    :root {
      --primary: #2563eb;
      --success: #16a34a;
      --error: #dc2626;
      --border: #cbd5e1;
      --bg: #f8fafc;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 10px;
      margin: 0;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      width: 100%;
      max-width: 650px;
      text-align: center;
      box-sizing: border-box;
    }

    /* Thanh nhập tên và điểm số */
    .player-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 16px;
      gap: 10px;
      flex-wrap: wrap;
    }
    .player-bar input {
      padding: 6px 10px;
      font-size: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      outline: none;
      flex: 1;
      min-width: 140px;
    }
    .player-bar .score-tag {
      font-weight: bold;
      color: var(--primary);
      font-size: 15px;
    }

    /* Bộ lọc */
    .filter-panel {
      display: flex;
      gap: 12px;
      background: #f1f5f9;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      justify-content: space-around;
      flex-wrap: wrap;
    }
    .filter-item {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
    }
    .filter-item label {
      font-size: 12px;
      font-weight: 600;
      color: #475569;
    }
    .filter-item select {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      background: white;
      font-size: 14px;
      outline: none;
      cursor: pointer;
    }

    .vietnamese-prompt {
      font-size: 24px;
      font-weight: bold;
      color: #1e293b;
      margin-bottom: 8px;
    }

    .pinyin-container {
      margin-bottom: 20px;
      min-height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .btn-toggle-pinyin {
      background: #f1f5f9;
      border: 1px dashed #94a3b8;
      color: #475569;
      font-size: 13px;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-toggle-pinyin:hover { background: #e2e8f0; }
    .pinyin-hint {
      font-size: 16px;
      color: #0284c7;
      font-weight: 600;
      display: none;
    }

    /* Canvas vẽ chữ Hán */
    .boxes-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
      margin-bottom: 20px;
    }
    .box-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .canvas-container {
      position: relative;
      width: 180px;
      height: 180px;
      border: 2px solid var(--border);
      border-radius: 8px;
      background: 
        linear-gradient(to top right, transparent calc(50% - 0.5px), #f1f5f9 50%, transparent calc(50% + 0.5px)),
        linear-gradient(to bottom right, transparent calc(50% - 0.5px), #f1f5f9 50%, transparent calc(50% + 0.5px)),
        linear-gradient(to right, transparent calc(50% - 0.5px), #e2e8f0 50%, transparent calc(50% + 0.5px)),
        linear-gradient(to bottom, transparent calc(50% - 0.5px), #e2e8f0 50%, transparent calc(50% + 0.5px));
      touch-action: none;
    }
    .canvas-container.correct { border-color: var(--success); background-color: #f0fdf4; }
    .canvas-container.wrong { border-color: var(--error); }
    canvas { width: 100%; height: 100%; cursor: crosshair; }
    
    .btn-clear-single {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      font-size: 12px;
      color: #475569;
      padding: 4px 8px;
      cursor: pointer;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    button.main-btn {
      flex: 1;
      padding: 12px 0;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-check { background: var(--primary); color: white; }
    .btn-clear-all { background: #e2e8f0; color: #334155; }
    .btn-next { background: #0f172a; color: white; }
    
    #result-msg {
      margin-top: 16px;
      font-size: 16px;
      font-weight: bold;
      min-height: 24px;
    }
    .msg-correct { color: var(--success); }
    .msg-wrong { color: var(--error); }

    /* Thống kê từ */
    .lists-container {
      display: flex;
      gap: 16px;
      margin-top: 24px;
      text-align: left;
    }
    .list-box {
      flex: 1;
      border-radius: 8px;
      padding: 12px;
      font-size: 14px;
      max-height: 220px;
      overflow-y: auto;
      border: 1px solid #e2e8f0;
    }
    .correct-box { background: #f0fdf4; border-color: #bbf7d0; }
    .wrong-box { background: #fef2f2; border-color: #fecaca; }
    .list-title {
      font-weight: bold;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }
    .correct-box .list-title { color: var(--success); }
    .wrong-box .list-title { color: var(--error); }
    .word-item { padding: 4px 0; border-bottom: 1px dashed rgba(0,0,0,0.06); }
    .word-item:last-child { border-bottom: none; }

    /* Khung bảng xếp hạng */
    .leaderboard-card {
      margin-top: 24px;
      background: #fffbeb;
      border: 1px solid #fef3c7;
      border-radius: 8px;
      padding: 14px;
      text-align: left;
    }
    .leaderboard-title {
      font-weight: bold;
      color: #b45309;
      font-size: 16px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
    }
    .leaderboard-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    .leaderboard-table th {
      border-bottom: 1px solid #fde68a;
      padding: 6px 8px;
      color: #92400e;
      text-align: left;
    }
    .leaderboard-table td {
      padding: 6px 8px;
      border-bottom: 1px dashed #fef3c7;
      color: #451a03;
    }
    .rank-1 { font-weight: bold; color: #d97706; }
  </style>
</head>
<body>

  <div class="card">
    <!-- Nhập tên & Xem điểm số cá nhân -->
    <div class="player-bar">
      <div style="display: flex; align-items: center; gap: 6px; flex: 1;">
        <label style="font-size: 13px; font-weight: bold; color: #1e40af;">Tên bạn:</label>
        <input type="text" id="playerNameInput" placeholder="Nhập biệt danh..." onchange="savePlayerName()">
      </div>
      <div class="score-tag">Điểm đúng: <span id="myCorrectScore">0</span> từ</div>
    </div>

    <!-- Bộ lọc bài học -->
    <div class="filter-panel">
      <div class="filter-item">
        <label>Chọn bài:</label>
        <select id="lessonFilter" onchange="applyFilters()">
          <option value="all">Tất cả các bài</option>
        </select>
      </div>

      <div class="filter-item">
        <label>Thứ tự:</label>
        <select id="modeFilter" onchange="applyFilters()">
          <option value="order">Tuần tự</option>
          <option value="random">Ngẫu nhiên</option>
        </select>
      </div>

      <div class="filter-item">
        <label>Số lượng:</label>
        <select id="limitFilter" onchange="applyFilters()">
          <option value="all">Tất cả</option>
          <option value="10">10 từ</option>
          <option value="20">20 từ</option>
        </select>
      </div>
    </div>

    <!-- Hiển thị câu hỏi -->
    <div class="vietnamese-prompt" id="prompt-vn">Đang tải danh sách từ vựng...</div>
    
    <div class="pinyin-container">
      <button class="btn-toggle-pinyin" id="btn-toggle-pinyin" onclick="togglePinyin()">👁 Xem gợi ý Pinyin</button>
      <span class="pinyin-hint" id="prompt-pinyin"></span>
    </div>

    <div class="boxes-container" id="boxesContainer"></div>

    <div class="button-group">
      <button class="main-btn btn-clear-all" onclick="clearAllBoxes()">Xóa hết</button>
      <button class="main-btn btn-check" onclick="checkAllBoxes()">Kiểm tra</button>
      <button class="main-btn btn-next" id="btn-next" onclick="nextWord()">Từ tiếp theo ➔</button>
    </div>

    <div id="result-msg"></div>

    <!-- Phân loại Đã thuộc / Cần ôn lại -->
    <div class="lists-container">
      <div class="list-box correct-box">
        <div class="list-title"><span>Đã thuộc</span><span id="correct-count">0</span></div>
        <div id="correct-list"></div>
      </div>

      <div class="list-box wrong-box">
        <div class="list-title"><span>Cần ôn lại</span><span id="wrong-count">0</span></div>
        <div id="wrong-list"></div>
      </div>
    </div>

    <!-- Bảng xếp hạng trực tiếp -->
    <div class="leaderboard-card">
      <div class="leaderboard-title">
        <span>🏆 Bảng Xếp Hạng Điểm Cao</span>
        <span style="font-size: 12px; font-weight: normal; color: #78350f;">Cập nhật tự động</span>
      </div>
      <table class="leaderboard-table">
        <thead>
          <tr>
            <th style="width: 50px;">Hạng</th>
            <th>Tên</th>
            <th style="width: 100px; text-align: right;">Từ đúng</th>
          </tr>
        </thead>
        <tbody id="leaderboardBody">
          <tr><td colspan="3" style="text-align: center; color: #92400e;">Đang nạp dữ liệu xếp hạng...</td></tr>
        </tbody>
      </table>
    </div>

  </div>

  <script>
    /* ================= CẤU HÌNH FIREBASE ================= */
    const firebaseConfig = {
      apiKey: "AIzaSyD0zd7k81GaRAHN4apend-4fzjZhKFtQxQ",
      authDomain: "chinese-leaderboard.firebaseapp.com",
      databaseURL: "https://chinese-leaderboard-default-rtdb.firebaseio.com",
      projectId: "chinese-leaderboard",
      storageBucket: "chinese-leaderboard.firebasestorage.app",
      messagingSenderId: "896587858259",
      appId: "1:896587858259:web:5aa9af795127d2c973a1a6",
      measurementId: "G-GN32J5JEQ6"
    };

    let db = null;
    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
    } catch(e) {
      console.warn("Lỗi cấu hình Firebase:", e);
    }

    /* ================= LOGIC BẢNG XẾP HẠNG ================= */
    const masteredWordsSet = new Set();
    let playerId = localStorage.getItem("chinese_player_id");
    let playerName = localStorage.getItem("chinese_player_name") || "";

    if (!playerId) {
      playerId = "user_" + Math.random().toString(36).substr(2, 9);
      localStorage.setItem("chinese_player_id", playerId);
    }
    document.getElementById("playerNameInput").value = playerName;

    function savePlayerName() {
      const name = document.getElementById("playerNameInput").value.trim();
      if (name) {
        playerName = name;
        localStorage.setItem("chinese_player_name", playerName);
        syncScoreToFirebase();
      }
    }

    function syncScoreToFirebase() {
      if (!db) return;
      const finalName = playerName.trim() || "Ẩn danh";
      const score = masteredWordsSet.size;

      db.ref("leaderboard/" + playerId).set({
        name: finalName,
        score: score,
        updatedAt: Date.now()
      });
    }

    function listenLeaderboard() {
      if (!db) return;
      db.ref("leaderboard").orderByChild("score").limitToLast(10).on("value", snapshot => {
        const data = [];
        snapshot.forEach(child => {
          data.push(child.val());
        });
        data.reverse();

        const tbody = document.getElementById("leaderboardBody");
        tbody.innerHTML = "";

        if (data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="3" style="text-align: center;">Chưa có ai ghi điểm!</td></tr>';
          return;
        }

        data.forEach((p, idx) => {
          const rankIcon = idx === 0 ? "🥇 1" : idx === 1 ? "🥈 2" : idx === 2 ? "🥉 3" : `#${idx + 1}`;
          const isTop = idx === 0 ? "rank-1" : "";
          tbody.innerHTML += `
            <tr class="${isTop}">
              <td>${rankIcon}</td>
              <td>${p.name}</td>
              <td style="text-align: right; font-weight: bold;">${p.score} từ</td>
            </tr>
          `;
        });
      }, err => {
        console.error("Firebase Database Error:", err);
      });
    }

    /* ================= LOGIC ĐỌC EXCEL ================= */
    let allWords = [];
    let activeWords = [];
    let currentIndex = 0;
    let canvasInstances = [];
    let isPinyinVisible = false;

    const memorizedWords = new Map();
    const needReviewWords = new Map();

    async function autoLoadExcel() {
      try {
        const response = await fetch("words.xlsx?t=" + new Date().getTime());
        if (!response.ok) throw new Error("Chưa thấy words.xlsx");
        
        const arrayBuffer = await response.arrayBuffer();
        const workbook = XLSX.read(new Uint8Array(arrayBuffer), { type: "array" });
        const worksheet = workbook.Sheets[workbook.SheetNames[0]];
        const rawData = XLSX.utils.sheet_to_json(worksheet);

        if (rawData && rawData.length > 0) {
          allWords = rawData;
          setupLessonDropdown();
          applyFilters();
        } else {
          document.getElementById("prompt-vn").innerText = "File words.xlsx không có dữ liệu!";
        }
      } catch (err) {
        console.error(err);
        document.getElementById("prompt-vn").innerText = "Lỗi: Không tải được file words.xlsx!";
      }
    }

    function setupLessonDropdown() {
      const select = document.getElementById("lessonFilter");
      const lessons = [...new Set(allWords.map(w => w.lesson).filter(Boolean))];
      
      select.innerHTML = '<option value="all">Tất cả các bài</option>';
      lessons.forEach(l => {
        select.innerHTML += `<option value="${l}">${l}</option>`;
      });
    }

    function applyFilters() {
      const selectedLesson = document.getElementById("lessonFilter").value;
      const selectedMode = document.getElementById("modeFilter").value;
      const selectedLimit = document.getElementById("limitFilter").value;

      let filtered = selectedLesson === "all" 
        ? [...allWords] 
        : allWords.filter(w => String(w.lesson) === selectedLesson);

      if (selectedMode === "random") {
        filtered.sort(() => Math.random() - 0.5);
      }

      if (selectedLimit !== "all") {
        const limit = parseInt(selectedLimit, 10);
        filtered = filtered.slice(0, limit);
      }

      activeWords = filtered;
      currentIndex = 0;

      if (activeWords.length === 0) {
        document.getElementById("prompt-vn").innerText = "Không tìm thấy từ vựng nào trong bài này!";
        document.getElementById("boxesContainer").innerHTML = "";
        return;
      }

      loadWord(currentIndex);
    }

    function loadWord(index) {
      if (activeWords.length === 0) return;
      const item = activeWords[index];
      const lessonTag = item.lesson ? `[${item.lesson}] ` : "";
      document.getElementById("prompt-vn").innerText = `${lessonTag}Viết từ: "${item.vn || ''}"`;
      
      const pinyinEl = document.getElementById("prompt-pinyin");
      pinyinEl.innerText = `[ ${item.pinyin || ""} ]`;
      pinyinEl.style.display = "none";
      isPinyinVisible = false;
      document.getElementById("btn-toggle-pinyin").innerText = "👁 Xem gợi ý Pinyin";

      document.getElementById("result-msg").innerText = "";
      document.getElementById("result-msg").className = "";

      setupCanvasBoxes(String(item.hanzi).trim());
    }

    function togglePinyin() {
      const pinyinEl = document.getElementById("prompt-pinyin");
      const toggleBtn = document.getElementById("btn-toggle-pinyin");
      isPinyinVisible = !isPinyinVisible;
      pinyinEl.style.display = isPinyinVisible ? "inline" : "none";
      toggleBtn.innerText = isPinyinVisible ? "🙈 Ẩn Pinyin" : "👁 Xem gợi ý Pinyin";
    }

    /* ================= CANVAS VẼ & NHẬN DIỆN ================= */
    function setupCanvasBoxes(hanziWord) {
      const container = document.getElementById("boxesContainer");
      container.innerHTML = "";
      canvasInstances = [];

      for (let i = 0; i < hanziWord.length; i++) {
        const char = hanziWord[i];
        const wrapper = document.createElement("div");
        wrapper.className = "box-wrapper";

        const canvasBox = document.createElement("div");
        canvasBox.className = "canvas-container";

        const canvas = document.createElement("canvas");
        canvas.width = 180;
        canvas.height = 180;

        const clearBtn = document.createElement("button");
        clearBtn.className = "btn-clear-single";
        clearBtn.innerText = `Xóa ô ${i + 1}`;
        clearBtn.onclick = () => clearSingleBox(i);

        canvasBox.appendChild(canvas);
        wrapper.appendChild(canvasBox);
        wrapper.appendChild(clearBtn);
        container.appendChild(wrapper);

        const ctx = canvas.getContext("2d");
        ctx.lineWidth = 6;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.strokeStyle = "#1e293b";

        const state = {
          charTarget: char, canvas, ctx, container: canvasBox,
          strokes: [], currentStrokeX: [], currentStrokeY: [], currentStrokeT: [],
          isDrawing: false, strokeStartTime: 0
        };

        initDrawingEvents(state);
        canvasInstances.push(state);
      }
    }

    function initDrawingEvents(state) {
      const { canvas, ctx } = state;
      function getCoords(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return [Math.round(clientX - rect.left), Math.round(clientY - rect.top)];
      }

      function startStroke(e) {
        state.isDrawing = true;
        state.strokeStartTime = Date.now();
        const [x, y] = getCoords(e);
        ctx.beginPath();
        ctx.moveTo(x, y);
        state.currentStrokeX = [x];
        state.currentStrokeY = [y];
        state.currentStrokeT = [0];
      }

      function moveStroke(e) {
        if (!state.isDrawing) return;
        e.preventDefault();
        const [x, y] = getCoords(e);
        ctx.lineTo(x, y);
        ctx.stroke();
        state.currentStrokeX.push(x);
        state.currentStrokeY.push(y);
        state.currentStrokeT.push(Date.now() - state.strokeStartTime);
      }

      function endStroke() {
        if (!state.isDrawing) return;
        state.isDrawing = false;
        state.strokes.push([state.currentStrokeX, state.currentStrokeY, state.currentStrokeT]);
      }

      canvas.addEventListener("mousedown", startStroke);
      canvas.addEventListener("mousemove", moveStroke);
      window.addEventListener("mouseup", endStroke);
      canvas.addEventListener("touchstart", startStroke, { passive: false });
      canvas.addEventListener("touchmove", moveStroke, { passive: false });
      window.addEventListener("touchend", endStroke);
    }

    function clearSingleBox(index) {
      const state = canvasInstances[index];
      state.ctx.clearRect(0, 0, state.canvas.width, state.canvas.height);
      state.strokes = [];
      state.container.classList.remove("correct", "wrong");
    }

    function clearAllBoxes() {
      for (let i = 0; i < canvasInstances.length; i++) clearSingleBox(i);
      document.getElementById("result-msg").innerText = "";
    }

    async function recognizeChar(strokes) {
      if (!strokes || strokes.length === 0) return [];
      const payload = {
        app_version: 0.4, api_level: "537.36", device: "5.0", input_type: "0", options: "enable_pre_space",
        requests: [{
          writing_guide: { writing_area_width: 180, writing_area_height: 180 },
          pre_context: "", max_num_results: 10, max_completions: 0,
          language: "zh-t-i0-handwrit", ink: strokes
        }]
      };

      try {
        const response = await fetch("https://inputtools.google.com/request?ime=handwriting&app=mobilesearch&cs=1&oe=UTF-8", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await response.json();
        return data[0] === "SUCCESS" ? data[1][0][1] : [];
      } catch (err) {
        return [];
      }
    }

    async function checkAllBoxes() {
      const resultMsg = document.getElementById("result-msg");
      resultMsg.className = "";
      resultMsg.innerText = "Đang kiểm tra nét viết...";

      let allCorrect = true;
      let emptyFound = false;

      for (let i = 0; i < canvasInstances.length; i++) {
        const state = canvasInstances[i];
        if (state.strokes.length === 0) {
          state.container.classList.add("wrong");
          emptyFound = true;
          allCorrect = false;
          continue;
        }

        const candidates = await recognizeChar(state.strokes);
        if (candidates.includes(state.charTarget)) {
          state.container.classList.remove("wrong");
          state.container.classList.add("correct");
        } else {
          state.container.classList.remove("correct");
          state.container.classList.add("wrong");
          allCorrect = false;
        }
      }

      const currentWord = activeWords[currentIndex];

      if (emptyFound) {
        resultMsg.className = "msg-wrong";
        resultMsg.innerText = "Bạn chưa viết đủ các chữ!";
        recordWord(currentWord, false);
      } else if (allCorrect) {
        resultMsg.className = "msg-correct";
        resultMsg.innerText = `Chính xác! (${currentWord.hanzi})`;
        recordWord(currentWord, true);

        // Lưu điểm cá nhân và đẩy lên Realtime Database
        if (!masteredWordsSet.has(currentWord.hanzi)) {
          masteredWordsSet.add(currentWord.hanzi);
          document.getElementById("myCorrectScore").innerText = masteredWordsSet.size;
          syncScoreToFirebase();
        }
      } else {
        resultMsg.className = "msg-wrong";
        resultMsg.innerText = "Có chữ chưa đúng (ô viền đỏ). Bạn có thể xem gợi ý Pinyin!";
        recordWord(currentWord, false);
      }
    }

    function recordWord(wordObj, isCorrect) {
      const key = wordObj.hanzi;
      if (isCorrect) {
        memorizedWords.set(key, wordObj);
        needReviewWords.delete(key);
      } else {
        if (!memorizedWords.has(key)) needReviewWords.set(key, wordObj);
      }
      renderWordLists();
    }

    function renderWordLists() {
      const correctListEl = document.getElementById("correct-list");
      correctListEl.innerHTML = "";
      memorizedWords.forEach(w => {
        correctListEl.innerHTML += `<div class="word-item"><strong>${w.hanzi}</strong> (${w.pinyin}): ${w.vn}</div>`;
      });
      document.getElementById("correct-count").innerText = memorizedWords.size;

      const wrongListEl = document.getElementById("wrong-list");
      wrongListEl.innerHTML = "";
      needReviewWords.forEach(w => {
        wrongListEl.innerHTML += `<div class="word-item"><strong>${w.hanzi}</strong> (${w.pinyin}): ${w.vn}</div>`;
      });
      document.getElementById("wrong-count").innerText = needReviewWords.size;
    }

    function nextWord() {
      if (activeWords.length === 0) return;
      const currentWord = activeWords[currentIndex];
      if (!memorizedWords.has(currentWord.hanzi) && !needReviewWords.has(currentWord.hanzi)) {
        needReviewWords.set(currentWord.hanzi, currentWord);
        renderWordLists();
      }

      currentIndex = (currentIndex + 1) % activeWords.length;
      loadWord(currentIndex);
    }

    // Khởi chạy ứng dụng
    autoLoadExcel();
    listenLeaderboard();
  </script>
</body>
</html>
