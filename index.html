<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luyện Viết Chữ Hán</title>
  <style>
    :root {
      --primary: #2563eb;
      --success: #16a34a;
      --error: #dc2626;
      --bg: #f8fafc;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      margin: 0;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
    .vietnamese-prompt {
      font-size: 22px;
      font-weight: bold;
      color: #1e293b;
      margin-bottom: 6px;
    }
    .pinyin-hint {
      font-size: 15px;
      color: #64748b;
      margin-bottom: 16px;
    }
    /* Khung vẽ chữ Hán kèm ô mễ điền (chữ điền / chữ mễ) */
    .canvas-container {
      position: relative;
      width: 280px;
      height: 280px;
      margin: 0 auto;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      background: 
        linear-gradient(to top right, transparent calc(50% - 0.5px), #f1f5f9 50%, transparent calc(50% + 0.5px)),
        linear-gradient(to bottom right, transparent calc(50% - 0.5px), #f1f5f9 50%, transparent calc(50% + 0.5px)),
        linear-gradient(to right, transparent calc(50% - 0.5px), #e2e8f0 50%, transparent calc(50% + 0.5px)),
        linear-gradient(to bottom, transparent calc(50% - 0.5px), #e2e8f0 50%, transparent calc(50% + 0.5px));
      touch-action: none; /* Tránh cuộn trang khi vẽ trên điện thoại */
    }
    canvas {
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }
    button {
      flex: 1;
      padding: 10px 0;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-check { background: var(--primary); color: white; }
    .btn-clear { background: #e2e8f0; color: #334155; }
    .btn-next { background: #0f172a; color: white; display: none; margin-top: 10px; width: 100%; }
    
    #result-msg {
      margin-top: 15px;
      font-size: 16px;
      font-weight: bold;
      min-height: 24px;
    }
    .correct { color: var(--success); }
    .wrong { color: var(--error); }
  </style>
</head>
<body>

  <div class="card">
    <div class="vietnamese-prompt" id="prompt-vn">Đang tải...</div>
    <div class="pinyin-hint" id="prompt-pinyin"></div>

    <div class="canvas-container">
      <canvas id="drawCanvas" width="280" height="280"></canvas>
    </div>

    <div class="button-group">
      <button class="btn-clear" onclick="clearCanvas()">Xóa nét</button>
      <button class="btn-check" onclick="checkAnswer()">Kiểm tra</button>
    </div>

    <div id="result-msg"></div>
    <button class="btn-next" id="btn-next" onclick="nextWord()">Từ tiếp theo ➔</button>
  </div>

  <script>
    // 1. Danh sách từ vựng kiểm tra
    const wordList = [
      { hanzi: "你", pinyin: "nǐ", vn: "Bạn / Anh / Chị" },
      { hanzi: "好", pinyin: "hǎo", vn: "Tốt / Đẹp / Khỏe" },
      { hanzi: "学", pinyin: "xué", vn: "Học tập" },
      { hanzi: "生", pinyin: "shēng", vn: "Sinh / Sinh viên" },
      { hanzi: "谢", pinyin: "xiè", vn: "Cảm ơn" }
    ];

    let currentIndex = 0;
    const canvas = document.getElementById("drawCanvas");
    const ctx = canvas.getContext("2d");
    
    // Mảng lưu tọa độ nét phục vụ Google API
    // Cấu trúc: [ [ [x1, x2, ...], [y1, y2, ...], [t1, t2, ...] ], ... ]
    let strokes = [];
    let currentStrokeX = [];
    let currentStrokeY = [];
    let currentStrokeT = [];
    let isDrawing = false;
    let strokeStartTime = 0;

    // Cài đặt nét vẽ
    ctx.lineWidth = 8;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = "#1e293b";

    function loadWord(index) {
      const item = wordList[index];
      document.getElementById("prompt-vn").innerText = `Viết từ: "${item.vn}"`;
      document.getElementById("prompt-pinyin").innerText = `Pinyin: [ ${item.pinyin} ]`;
      document.getElementById("result-msg").innerText = "";
      document.getElementById("btn-next").style.display = "none";
      clearCanvas();
    }

    function getCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return [
        Math.round(clientX - rect.left),
        Math.round(clientY - rect.top)
      ];
    }

    // Bắt sự kiện vẽ (Chuột & Màn hình cảm ứng)
    function startStroke(e) {
      isDrawing = true;
      strokeStartTime = Date.now();
      const [x, y] = getCoords(e);
      ctx.beginPath();
      ctx.moveTo(x, y);

      currentStrokeX = [x];
      currentStrokeY = [y];
      currentStrokeT = [0];
    }

    function moveStroke(e) {
      if (!isDrawing) return;
      e.preventDefault();
      const [x, y] = getCoords(e);
      ctx.lineTo(x, y);
      ctx.stroke();

      currentStrokeX.push(x);
      currentStrokeY.push(y);
      currentStrokeT.push(Date.now() - strokeStartTime);
    }

    function endStroke() {
      if (!isDrawing) return;
      isDrawing = false;
      strokes.push([currentStrokeX, currentStrokeY, currentStrokeT]);
    }

    canvas.addEventListener("mousedown", startStroke);
    canvas.addEventListener("mousemove", moveStroke);
    window.addEventListener("mouseup", endStroke);

    canvas.addEventListener("touchstart", startStroke, { passive: false });
    canvas.addEventListener("touchmove", moveStroke, { passive: false });
    window.addEventListener("touchend", endStroke);

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      strokes = [];
      document.getElementById("result-msg").innerText = "";
    }

    // 2. Gửi nét vẽ lên Google Input Tools API để nhận diện
    async function checkAnswer() {
      if (strokes.length === 0) {
        alert("Vui lòng vẽ chữ trước khi kiểm tra!");
        return;
      }

      const resultEl = document.getElementById("result-msg");
      resultEl.className = "";
      resultEl.innerText = "Đang nhận diện nét vẽ...";

      const payload = {
        app_version: 0.4,
        api_level: "537.36",
        device: "5.0",
        input_type: "0",
        options: "enable_pre_space",
        requests: [{
          writing_guide: { writing_area_width: 280, writing_area_height: 280 },
          pre_context: "",
          max_num_results: 10,
          max_completions: 0,
          language: "zh-t-i0-handwrit", // Nhận diện chữ Hán
          ink: strokes
        }]
      };

      try {
        const response = await fetch("https://inputtools.google.com/request?ime=handwriting&app=mobilesearch&cs=1&oe=UTF-8", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await response.json();
        
        if (data[0] === "SUCCESS") {
          const candidates = data[1][0][1]; // Mảng các chữ gợi ý: ["你", "仁", ...]
          const target = wordList[currentIndex].hanzi;

          if (candidates.includes(target)) {
            resultEl.className = "correct";
            resultEl.innerText = `Chính xác! Bạn đã viết đúng chữ: ${target}`;
            document.getElementById("btn-next").style.display = "block";
          } else {
            resultEl.className = "wrong";
            resultEl.innerText = `Chưa đúng! Hệ thống nhận diện thành: ${candidates.slice(0, 3).join(", ")}. Hãy thử lại!`;
          }
        } else {
          resultEl.innerText = "Không thể nhận diện, vui lòng thử lại!";
        }
      } catch (err) {
        console.error(err);
        resultEl.innerText = "Lỗi kết nối khi nhận diện nét vẽ!";
      }
    }

    function nextWord() {
      currentIndex = (currentIndex + 1) % wordList.length;
      loadWord(currentIndex);
    }

    // Khởi tạo từ đầu tiên
    loadWord(currentIndex);
  </script>
</body>
</html>
