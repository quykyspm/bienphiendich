<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luyện Viết Chữ Hán - Thống Kê Từ Vựng</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --primary: #2563eb;
      --success: #16a34a;
      --error: #dc2626;
      --border: #cbd5e1;
      --bg: #f8fafc;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 10px;
      margin: 0;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      width: 100%;
      max-width: 650px;
      text-align: center;
      box-sizing: border-box;
    }
    .vietnamese-prompt {
      font-size: 24px;
      font-weight: bold;
      color: #1e293b;
      margin-bottom: 6px;
    }
    .pinyin-hint {
      font-size: 16px;
      color: #64748b;
      margin-bottom: 20px;
    }
    .boxes-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
      margin-bottom: 20px;
    }
    .box-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .canvas-container {
      position: relative;
      width: 180px;
      height: 180px;
      border: 2px solid var(--border);
      border-radius: 8px;
      background: 
        linear-gradient(to top right, transparent calc(50% - 0.5px), #f1f5f9 50%, transparent calc(50% + 0.5px)),
        linear-gradient(to bottom right, transparent calc(50% - 0.5px), #f1f5f9 50%, transparent calc(50% + 0.5px)),
        linear-gradient(to right, transparent calc(50% - 0.5px), #e2e8f0 50%, transparent calc(50% + 0.5px)),
        linear-gradient(to bottom, transparent calc(50% - 0.5px), #e2e8f0 50%, transparent calc(50% + 0.5px));
      touch-action: none;
      transition: border-color 0.2s;
    }
    .canvas-container.correct { border-color: var(--success); background-color: #f0fdf4; }
    .canvas-container.wrong { border-color: var(--error); }
    canvas {
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }
    .btn-clear-single {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      font-size: 12px;
      color: #475569;
      padding: 4px 8px;
      cursor: pointer;
    }
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    button.main-btn {
      flex: 1;
      padding: 12px 0;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-check { background: var(--primary); color: white; }
    .btn-clear-all { background: #e2e8f0; color: #334155; }
    .btn-next { background: #0f172a; color: white; }
    
    #result-msg {
      margin-top: 16px;
      font-size: 16px;
      font-weight: bold;
      min-height: 24px;
    }
    .msg-correct { color: var(--success); }
    .msg-wrong { color: var(--error); }

    /* Khu vực bảng phân loại từ đã nhớ / từ sai */
    .lists-container {
      display: flex;
      gap: 16px;
      margin-top: 24px;
      text-align: left;
    }
    .list-box {
      flex: 1;
      border-radius: 8px;
      padding: 12px;
      font-size: 14px;
      max-height: 220px;
      overflow-y: auto;
      border: 1px solid #e2e8f0;
    }
    .correct-box { background: #f0fdf4; border-color: #bbf7d0; }
    .wrong-box { background: #fef2f2; border-color: #fecaca; }
    .list-title {
      font-weight: bold;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }
    .correct-box .list-title { color: var(--success); }
    .wrong-box .list-title { color: var(--error); }
    .word-item {
      padding: 4px 0;
      border-bottom: 1px dashed rgba(0,0,0,0.06);
    }
    .word-item:last-child { border-bottom: none; }
    .word-item strong { font-size: 15px; }
  </style>
</head>
<body>

  <div class="card">
    <div class="vietnamese-prompt" id="prompt-vn">Đang tải danh sách từ vựng...</div>
    <div class="pinyin-hint" id="prompt-pinyin"></div>

    <div class="boxes-container" id="boxesContainer"></div>

    <div class="button-group">
      <button class="main-btn btn-clear-all" onclick="clearAllBoxes()">Xóa hết</button>
      <button class="main-btn btn-check" onclick="checkAllBoxes()">Kiểm tra</button>
      <button class="main-btn btn-next" id="btn-next" onclick="nextWord(false)">Từ tiếp theo ➔</button>
    </div>

    <div id="result-msg"></div>

    <!-- Bảng hiển thị danh sách phân loại từ vựng -->
    <div class="lists-container">
      <div class="list-box correct-box">
        <div class="list-title">
          <span>Đã nhớ (Đúng)</span>
          <span id="correct-count">0</span>
        </div>
        <div id="correct-list"></div>
      </div>

      <div class="list-box wrong-box">
        <div class="list-title">
          <span>Cần ôn lại (Sai/Bỏ qua)</span>
          <span id="wrong-count">0</span>
        </div>
        <div id="wrong-list"></div>
      </div>
    </div>
  </div>

  <script>
    let wordList = [];
    let currentIndex = 0;
    let canvasInstances = [];

    // Bộ lưu trữ từ đã nhớ và từ cần ôn lại (lưu dạng Map để không trùng)
    const memorizedWords = new Map();
    const needReviewWords = new Map();

    async function autoLoadExcel() {
      try {
        const response = await fetch("words.xlsx?t=" + new Date().getTime());
        if (!response.ok) throw new Error("Chưa thấy file words.xlsx");
        
        const arrayBuffer = await response.arrayBuffer();
        const workbook = XLSX.read(new Uint8Array(arrayBuffer), { type: "array" });
        const firstSheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[firstSheetName];
        const rawData = XLSX.utils.sheet_to_json(worksheet);

        if (rawData && rawData.length > 0) {
          wordList = rawData;
          loadWord(0);
        } else {
          document.getElementById("prompt-vn").innerText = "File words.xlsx không có dữ liệu!";
        }
      } catch (err) {
        console.error(err);
        document.getElementById("prompt-vn").innerText = "Lỗi: Không tải được file words.xlsx!";
      }
    }

    function loadWord(index) {
      if (wordList.length === 0) return;
      const item = wordList[index];
      document.getElementById("prompt-vn").innerText = `Viết từ: "${item.vn}"`;
      document.getElementById("prompt-pinyin").innerText = `Pinyin: [ ${item.pinyin || ""} ]`;
      document.getElementById("result-msg").innerText = "";
      document.getElementById("result-msg").className = "";

      setupCanvasBoxes(String(item.hanzi).trim());
    }

    function setupCanvasBoxes(hanziWord) {
      const container = document.getElementById("boxesContainer");
      container.innerHTML = "";
      canvasInstances = [];

      for (let i = 0; i < hanziWord.length; i++) {
        const char = hanziWord[i];

        const wrapper = document.createElement("div");
        wrapper.className = "box-wrapper";

        const canvasBox = document.createElement("div");
        canvasBox.className = "canvas-container";

        const canvas = document.createElement("canvas");
        canvas.width = 180;
        canvas.height = 180;

        const clearBtn = document.createElement("button");
        clearBtn.className = "btn-clear-single";
        clearBtn.innerText = `Xóa ô ${i + 1}`;
        clearBtn.onclick = () => clearSingleBox(i);

        canvasBox.appendChild(canvas);
        wrapper.appendChild(canvasBox);
        wrapper.appendChild(clearBtn);
        container.appendChild(wrapper);

        const ctx = canvas.getContext("2d");
        ctx.lineWidth = 6;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.strokeStyle = "#1e293b";

        const state = {
          charTarget: char,
          canvas: canvas,
          ctx: ctx,
          container: canvasBox,
          strokes: [],
          currentStrokeX: [],
          currentStrokeY: [],
          currentStrokeT: [],
          isDrawing: false,
          strokeStartTime: 0
        };

        initDrawingEvents(state);
        canvasInstances.push(state);
      }
    }

    function initDrawingEvents(state) {
      const { canvas, ctx } = state;

      function getCoords(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return [
          Math.round(clientX - rect.left),
          Math.round(clientY - rect.top)
        ];
      }

      function startStroke(e) {
        state.isDrawing = true;
        state.strokeStartTime = Date.now();
        const [x, y] = getCoords(e);
        ctx.beginPath();
        ctx.moveTo(x, y);

        state.currentStrokeX = [x];
        state.currentStrokeY = [y];
        state.currentStrokeT = [0];
      }

      function moveStroke(e) {
        if (!state.isDrawing) return;
        e.preventDefault();
        const [x, y] = getCoords(e);
        ctx.lineTo(x, y);
        ctx.stroke();

        state.currentStrokeX.push(x);
        state.currentStrokeY.push(y);
        state.currentStrokeT.push(Date.now() - state.strokeStartTime);
      }

      function endStroke() {
        if (!state.isDrawing) return;
        state.isDrawing = false;
        state.strokes.push([state.currentStrokeX, state.currentStrokeY, state.currentStrokeT]);
      }

      canvas.addEventListener("mousedown", startStroke);
      canvas.addEventListener("mousemove", moveStroke);
      window.addEventListener("mouseup", endStroke);

      canvas.addEventListener("touchstart", startStroke, { passive: false });
      canvas.addEventListener("touchmove", moveStroke, { passive: false });
      window.addEventListener("touchend", endStroke);
    }

    function clearSingleBox(index) {
      const state = canvasInstances[index];
      state.ctx.clearRect(0, 0, state.canvas.width, state.canvas.height);
      state.strokes = [];
      state.container.classList.remove("correct", "wrong");
    }

    function clearAllBoxes() {
      for (let i = 0; i < canvasInstances.length; i++) {
        clearSingleBox(i);
      }
      document.getElementById("result-msg").innerText = "";
      document.getElementById("result-msg").className = "";
    }

    async function recognizeChar(strokes) {
      if (!strokes || strokes.length === 0) return [];

      const payload = {
        app_version: 0.4,
        api_level: "537.36",
        device: "5.0",
        input_type: "0",
        options: "enable_pre_space",
        requests: [{
          writing_guide: { writing_area_width: 180, writing_area_height: 180 },
          pre_context: "",
          max_num_results: 10,
          max_completions: 0,
          language: "zh-t-i0-handwrit",
          ink: strokes
        }]
      };

      try {
        const response = await fetch("https://inputtools.google.com/request?ime=handwriting&app=mobilesearch&cs=1&oe=UTF-8", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await response.json();
        if (data[0] === "SUCCESS") {
          return data[1][0][1];
        }
      } catch (err) {
        console.error(err);
      }
      return [];
    }

    async function checkAllBoxes() {
      const resultMsg = document.getElementById("result-msg");
      resultMsg.className = "";
      resultMsg.innerText = "Đang kiểm tra nét viết...";

      let allCorrect = true;
      let emptyFound = false;

      for (let i = 0; i < canvasInstances.length; i++) {
        const state = canvasInstances[i];

        if (state.strokes.length === 0) {
          state.container.classList.add("wrong");
          emptyFound = true;
          allCorrect = false;
          continue;
        }

        const candidates = await recognizeChar(state.strokes);

        if (candidates.includes(state.charTarget)) {
          state.container.classList.remove("wrong");
          state.container.classList.add("correct");
        } else {
          state.container.classList.remove("correct");
          state.container.classList.add("wrong");
          allCorrect = false;
        }
      }

      const currentWord = wordList[currentIndex];

      if (emptyFound) {
        resultMsg.className = "msg-wrong";
        resultMsg.innerText = "Bạn chưa viết đủ các chữ!";
        recordWord(currentWord, false);
      } else if (allCorrect) {
        resultMsg.className = "msg-correct";
        resultMsg.innerText = `Chính xác! (${currentWord.hanzi})`;
        recordWord(currentWord, true);
      } else {
        resultMsg.className = "msg-wrong";
        resultMsg.innerText = "Có chữ chưa đúng (viền đỏ). Bạn có thể thử lại hoặc bấm Từ tiếp theo!";
        recordWord(currentWord, false);
      }
    }

    // Cập nhật từ vào bảng Đúng hoặc Sai
    function recordWord(wordObj, isCorrect) {
      const key = wordObj.hanzi;
      if (isCorrect) {
        memorizedWords.set(key, wordObj);
        needReviewWords.delete(key); // Xóa khỏi danh sách sai nếu đã nhớ đúng
      } else {
        if (!memorizedWords.has(key)) {
          needReviewWords.set(key, wordObj);
        }
      }
      renderWordLists();
    }

    function renderWordLists() {
      // Danh sách đúng
      const correctListEl = document.getElementById("correct-list");
      correctListEl.innerHTML = "";
      memorizedWords.forEach(w => {
        correctListEl.innerHTML += `<div class="word-item"><strong>${w.hanzi}</strong> (${w.pinyin}): ${w.vn}</div>`;
      });
      document.getElementById("correct-count").innerText = memorizedWords.size;

      // Danh sách sai / cần ôn
      const wrongListEl = document.getElementById("wrong-list");
      wrongListEl.innerHTML = "";
      needReviewWords.forEach(w => {
        wrongListEl.innerHTML += `<div class="word-item"><strong>${w.hanzi}</strong> (${w.pinyin}): ${w.vn}</div>`;
      });
      document.getElementById("wrong-count").innerText = needReviewWords.size;
    }

    function nextWord(isSkip = false) {
      if (wordList.length === 0) return;

      // Nếu bấm next khi chưa bấm kiểm tra và chưa thuộc từ này, đưa vào danh sách cần ôn
      const currentWord = wordList[currentIndex];
      if (!memorizedWords.has(currentWord.hanzi) && !needReviewWords.has(currentWord.hanzi)) {
        needReviewWords.set(currentWord.hanzi, currentWord);
        renderWordLists();
      }

      currentIndex = (currentIndex + 1) % wordList.length;
      loadWord(currentIndex);
    }

    autoLoadExcel();
  </script>
</body>
</html>
